<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writerly — AI Reading Tutor</title>
<script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --border: #e8e4df;
    --text: #2d2a26;
    --muted: #8a857e;
    --primary: #6c5ce7;
    --primary-light: #a29bfe;
    --green: #00b894;
    --yellow: #fdcb6e;
    --red: #e17055;
    --blue: #74b9ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-size: 36px; font-weight: 700; color: var(--primary); letter-spacing: -1px; }
  .header p { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .container { max-width: 750px; width: 100%; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .card-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 16px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .reading-text { font-size: 24px; line-height: 1.8; color: var(--text); }
  .reading-text .word {
    padding: 2px 4px; border-radius: 4px; cursor: default;
    transition: background 0.2s; position: relative; display: inline-block;
  }
  .reading-text .word:hover { opacity: 0.8; }
  .word-perfect { background: rgba(0,184,148,0.15); color: #00875a; }
  .word-good { background: rgba(0,184,148,0.08); }
  .word-fair { background: rgba(253,203,110,0.25); color: #b8860b; }
  .word-poor { background: rgba(225,112,85,0.2); color: #c0392b; }
  .word-missed { background: rgba(225,112,85,0.1); color: #c0392b; text-decoration: line-through; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .btn {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px; font-weight: 600; padding: 14px 32px;
    border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover:not(:disabled) { background: #5a4bd1; }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover:not(:disabled) { background: #d35400; }
  .btn-finish { background: var(--green); color: white; }
  .btn-finish:hover:not(:disabled) { background: #00a381; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-secondary:hover:not(:disabled) { background: #d4d0cb; }

  .status {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px; color: var(--muted); text-align: center; min-height: 20px;
  }
  .status.recording { color: var(--red); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
  .score-item { text-align: center; padding: 14px 8px; background: var(--bg); border-radius: 12px; }
  .score-value { font-size: 28px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .score-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-top: 4px; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .score-green { color: var(--green); }
  .score-yellow { color: var(--yellow); }
  .score-red { color: var(--red); }

  .level-select {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px;
  }
  .level-btn {
    font-size: 13px; padding: 8px 16px; border: 1px solid var(--border);
    border-radius: 8px; background: white; cursor: pointer; transition: all 0.2s;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .level-btn:hover { border-color: var(--primary); }
  .level-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .tooltip {
    display: none; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
    background: var(--text); color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; z-index: 10;
  }
  .tooltip::after {
    content: ''; position: absolute; top: 100%; left: 50%; margin-left: -4px;
    border-width: 4px; border-style: solid; border-color: var(--text) transparent transparent transparent;
  }
  .word:hover .tooltip { display: block; }

  /* Transcript section */
  .transcript-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .transcript-col h4 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 8px;
  }
  .transcript-col p {
    font-size: 15px; line-height: 1.7; padding: 12px 16px;
    background: var(--bg); border-radius: 10px;
  }
  .transcript-col .diff-word { font-weight: 700; }
  .diff-sub { color: var(--red); text-decoration: underline; }
  .diff-del { color: var(--red); text-decoration: line-through; opacity: 0.6; }
  .diff-ins { color: var(--blue); font-style: italic; }
  .diff-ok { color: var(--green); }

  /* AI Tutor feedback */
  .tutor-section {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin-top: 16px;
  }
  .tutor-message {
    padding: 20px; background: linear-gradient(135deg, #f3f0ff 0%, #e8f4f8 100%);
    border-radius: 12px; border-left: 4px solid var(--primary); margin-bottom: 12px;
  }
  .tutor-message .tutor-icon { font-size: 20px; margin-right: 8px; }
  .tutor-message h3 {
    font-size: 16px; color: var(--primary); margin-bottom: 8px;
    display: flex; align-items: center;
  }
  .tutor-message p, .tutor-message li {
    font-size: 14px; line-height: 1.7; color: var(--text);
  }
  .tutor-message ul { margin: 8px 0 0 20px; }
  .tutor-message li { margin-bottom: 4px; }

  /* Practice words */
  .practice-words {
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px;
  }
  .practice-word {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px; font-weight: 600; padding: 10px 20px;
    background: rgba(225,112,85,0.1); color: var(--red);
    border: 1px solid rgba(225,112,85,0.3); border-radius: 10px;
  }

  /* Session history */
  .history-chart {
    display: flex; align-items: flex-end; gap: 6px; height: 80px; margin-top: 12px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .history-bar {
    flex: 1; min-width: 20px; max-width: 40px; border-radius: 4px 4px 0 0;
    transition: height 0.3s; position: relative; cursor: default;
  }
  .history-bar:hover::after {
    content: attr(data-label); position: absolute; bottom: 105%;
    left: 50%; transform: translateX(-50%); background: var(--text); color: white;
    font-size: 11px; padding: 3px 8px; border-radius: 4px; white-space: nowrap;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .history-meta {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center;
  }

  @media (max-width: 600px) {
    .transcript-grid { grid-template-columns: 1fr; }
    .scores { grid-template-columns: repeat(3, 1fr); }
  }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>Writerly</h1>
  <p>AI Reading Tutor</p>
</div>

<div class="container">
  <!-- Level Selection -->
  <div class="card">
    <div class="card-label">Reading Level</div>
    <div class="level-select">
      <button class="level-btn active" data-level="k1">K-1st</button>
      <button class="level-btn" data-level="2nd3rd">2nd-3rd</button>
      <button class="level-btn" data-level="4th5th">4th-5th</button>
      <button class="level-btn" data-level="6th8th">6th-8th</button>
    </div>
  </div>

  <!-- Reading Passage -->
  <div class="card">
    <div class="card-label">Read this passage aloud</div>
    <div class="reading-text" id="readingText"></div>
  </div>

  <!-- Controls -->
  <div class="card">
    <div class="controls">
      <button class="btn btn-primary" id="btnStart" onclick="startReading()">Start Reading</button>
      <button class="btn btn-finish" id="btnFinish" onclick="finishReading()" disabled>Finish Reading</button>
      <button class="btn btn-secondary" id="btnNew" onclick="newPassage()">New Passage</button>
    </div>
    <div class="status" id="status" style="margin-top: 12px;"></div>
  </div>

  <!-- Scores -->
  <div class="card hidden" id="scoresCard">
    <div class="card-label">Scores</div>
    <div class="scores" id="scores"></div>
  </div>

  <!-- Transcript Comparison -->
  <div class="card hidden" id="transcriptCard">
    <div class="card-label">Transcript Comparison</div>
    <div class="transcript-grid">
      <div class="transcript-col">
        <h4>Expected (Reference)</h4>
        <p id="transcriptRef"></p>
      </div>
      <div class="transcript-col">
        <h4>What We Heard</h4>
        <p id="transcriptHeard"></p>
      </div>
    </div>
  </div>

  <!-- AI Tutor Feedback -->
  <div class="card hidden" id="tutorCard">
    <div class="card-label">AI Tutor Feedback</div>
    <div class="tutor-section" id="tutorFeedback"></div>
  </div>

  <!-- Practice Words -->
  <div class="card hidden" id="practiceCard">
    <div class="card-label">Words to Practice</div>
    <p style="font-family:-apple-system,sans-serif;font-size:14px;color:var(--muted);margin-bottom:12px;">
      Try saying each word slowly and clearly, then read the passage again.
    </p>
    <div class="practice-words" id="practiceWords"></div>
  </div>

  <!-- Session History -->
  <div class="card hidden" id="historyCard">
    <div class="card-label">Session Progress</div>
    <div class="history-chart" id="historyChart"></div>
    <div class="history-meta" id="historyMeta"></div>
  </div>
</div>

<script>
const AZURE_KEY = 'YOUR_AZURE_SPEECH_KEY_HERE';
const AZURE_REGION = 'eastus';

const PASSAGES = {
  k1: [
    "The cat sat on the mat. It was a big, fat cat. The cat liked to nap in the sun.",
    "I see a red ball. The ball can hop. Hop, hop, hop! The ball is fun.",
    "My dog is brown. He likes to run and play. We go to the park every day.",
    "The fish swims in the pond. It is a little blue fish. Splash, splash!",
    "Look at the bird in the tree. It sings a pretty song. Tweet, tweet, tweet!"
  ],
  "2nd3rd": [
    "The butterfly landed on a bright yellow flower. Its wings were orange and black. It stayed for a moment, then flew away into the garden.",
    "Sam and his sister walked to the library after school. They found a book about dinosaurs. It had pictures of a huge T-Rex with sharp teeth.",
    "Rain fell softly on the rooftop. The children watched through the window. A rainbow appeared in the sky when the sun came out again.",
    "The farmer planted seeds in the spring. He watered them every morning. By summer, tall sunflowers filled the field with bright yellow blooms."
  ],
  "4th5th": [
    "The ancient castle stood on top of a rocky cliff overlooking the ocean. Waves crashed against the stones below, sending white spray into the salty air. A narrow path wound its way up the hillside to the castle gates.",
    "Scientists discovered a new species of frog living deep in the rainforest. The tiny creature was bright blue with golden spots on its back. It could fit on the tip of a human finger.",
    "The astronaut floated gently inside the space station, watching Earth rotate slowly below. Continents and oceans passed by like a living map. She smiled, thinking about how beautiful our planet looked from above."
  ],
  "6th8th": [
    "Throughout history, civilizations have risen and fallen along the banks of great rivers. The Nile, the Tigris, and the Yangtze each nurtured communities that developed writing, agriculture, and complex systems of government. These waterways provided not only sustenance but also routes for trade and cultural exchange.",
    "The discovery of penicillin by Alexander Fleming in nineteen twenty-eight revolutionized modern medicine. What began as an accidental observation of mold inhibiting bacterial growth eventually led to the development of antibiotics that have saved countless millions of lives worldwide.",
    "Renewable energy sources such as solar, wind, and hydroelectric power are becoming increasingly important as nations work to reduce their dependence on fossil fuels. Engineers and scientists continue to improve the efficiency of these technologies, making clean energy more accessible and affordable for communities around the globe."
  ]
};

let currentLevel = 'k1';
let currentText = '';
let recognizer = null;
let sessionHistory = JSON.parse(localStorage.getItem('writerly_history') || '[]');
let allRecognizedWords = [];
let allRecognizedText = '';
let finalPronScores = { accuracy: 0, fluency: 0, completeness: 0, prosody: 0, overall: 0 };
let pronScoreWeights = 0;

function init() {
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLevel = btn.dataset.level;
      newPassage();
    });
  });
  newPassage();
  renderHistory();
}

function newPassage() {
  const passages = PASSAGES[currentLevel];
  currentText = passages[Math.floor(Math.random() * passages.length)];
  document.getElementById('readingText').textContent = currentText;
  hideResults();
}

function hideResults() {
  ['scoresCard','transcriptCard','tutorCard','practiceCard'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = 'status';
}

async function startReading() {
  const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
  speechConfig.speechRecognitionLanguage = 'en-US';

  // Give kids more time to pause between words/sentences
  speechConfig.setProperty(SpeechSDK.PropertyId.Speech_SegmentationSilenceTimeoutMs, "3000");
  speechConfig.setProperty(SpeechSDK.PropertyId.SpeechServiceConnection_EndSilenceTimeoutMs, "5000");

  // Optimize for children's voices
  speechConfig.setProperty("SpeechServiceConnection_ChildSpeech", "true");

  // Use microphone with noise suppression and auto gain
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { noiseSuppression: true, echoCancellation: true, autoGainControl: true }
  });
  window._writerlyStream = stream;
  const audioConfig = SpeechSDK.AudioConfig.fromStreamInput(stream);

  const pronConfig = new SpeechSDK.PronunciationAssessmentConfig(
    currentText,
    SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,
    SpeechSDK.PronunciationAssessmentGranularity.Phoneme,
    true
  );
  pronConfig.enableProsodyAssessment = true;

  recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);
  pronConfig.applyTo(recognizer);

  // Reset accumulators
  allRecognizedWords = [];
  allRecognizedText = '';
  finalPronScores = { accuracy: 0, fluency: 0, completeness: 0, prosody: 0, overall: 0 };
  pronScoreWeights = 0;

  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnFinish').disabled = false;
  document.getElementById('status').textContent = 'Listening... read the full passage, then click "Finish Reading"';
  document.getElementById('status').className = 'status recording';
  hideResults();

  // Collect partial results as they come in
  recognizer.recognized = function (s, e) {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
      allRecognizedText += (allRecognizedText ? ' ' : '') + e.result.text;

      // Accumulate word-level data
      try {
        const json = JSON.parse(e.result.properties.getProperty(
          SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult
        ));
        const nBest = json.NBest && json.NBest[0];
        if (nBest && nBest.Words) {
          allRecognizedWords = allRecognizedWords.concat(nBest.Words);
        }
        if (nBest && nBest.PronunciationAssessment) {
          const pa = nBest.PronunciationAssessment;
          // Weight scores by word count so longer segments count more
          const segmentWords = nBest.Words ? nBest.Words.length : 1;
          finalPronScores.accuracy += (pa.AccuracyScore || 0) * segmentWords;
          finalPronScores.fluency += (pa.FluencyScore || 0) * segmentWords;
          finalPronScores.completeness += (pa.CompletenessScore || 0) * segmentWords;
          finalPronScores.prosody += (pa.ProsodyScore || 0) * segmentWords;
          finalPronScores.overall += (pa.PronScore || 0) * segmentWords;
          pronScoreWeights += segmentWords;
        }
      } catch (err) { /* ignore parse errors */ }

      // Update live word count
      const wordsSoFar = allRecognizedText.split(/\s+/).filter(Boolean).length;
      const totalWords = currentText.split(/\s+/).length;
      document.getElementById('status').innerHTML =
        `<span style="color:var(--red);animation:pulse 1.5s infinite">Recording...</span> ` +
        `<span style="color:var(--muted)">${wordsSoFar} / ${totalWords} words heard</span>`;
    }
  };

  recognizer.canceled = function (s, e) {
    if (e.reason === SpeechSDK.CancellationReason.Error) {
      setStatus('Error: ' + e.errorDetails);
      resetControls();
    }
  };

  recognizer.startContinuousRecognitionAsync(
    function () { /* started */ },
    function (err) {
      setStatus('Error starting: ' + err);
      resetControls();
    }
  );
}

function finishReading() {
  if (!recognizer) return;

  document.getElementById('btnFinish').disabled = true;
  setStatus('Analyzing your reading...');

  recognizer.stopContinuousRecognitionAsync(
    function () {
      // Build final results
      if (allRecognizedWords.length > 0 && pronScoreWeights > 0) {
        const avgScores = {
          accuracyScore: finalPronScores.accuracy / pronScoreWeights,
          fluencyScore: finalPronScores.fluency / pronScoreWeights,
          completenessScore: finalPronScores.completeness / pronScoreWeights,
          prosodyScore: finalPronScores.prosody / pronScoreWeights,
          pronunciationScore: finalPronScores.overall / pronScoreWeights,
        };
        displayResultsFromContinuous(avgScores, allRecognizedWords, allRecognizedText);
      } else {
        setStatus('No speech detected. Please try again.');
      }
      recognizer.close();
      recognizer = null;
      if (window._writerlyStream) {
        window._writerlyStream.getTracks().forEach(t => t.stop());
        window._writerlyStream = null;
      }
      resetControls();
    },
    function (err) {
      setStatus('Error stopping: ' + err);
      recognizer.close();
      recognizer = null;
      if (window._writerlyStream) {
        window._writerlyStream.getTracks().forEach(t => t.stop());
        window._writerlyStream = null;
      }
      resetControls();
    }
  );
}

function stopReading() {
  if (recognizer) {
    recognizer.stopContinuousRecognitionAsync(
      function () { recognizer.close(); recognizer = null; },
      function () { recognizer.close(); recognizer = null; }
    );
  }
  // Release microphone
  if (window._writerlyStream) {
    window._writerlyStream.getTracks().forEach(t => t.stop());
    window._writerlyStream = null;
  }
  resetControls();
  setStatus('Stopped.');
}

function resetControls() {
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnFinish').disabled = true;
}

function displayResultsFromContinuous(scores, words, recognizedText) {
  const accuracy = Math.round(scores.accuracyScore);
  const fluency = Math.round(scores.fluencyScore);
  const completeness = Math.round(scores.completenessScore);
  const prosody = Math.round(scores.prosodyScore || 0);
  const overall = Math.round(scores.pronunciationScore);

  // WER
  const werResult = calcWER(currentText, recognizedText);

  // Scores card
  document.getElementById('scores').innerHTML = `
    <div class="score-item">
      <div class="score-value ${scoreColor(overall)}">${overall}</div>
      <div class="score-label">Overall</div>
    </div>
    <div class="score-item">
      <div class="score-value ${scoreColor(accuracy)}">${accuracy}</div>
      <div class="score-label">Accuracy</div>
    </div>
    <div class="score-item">
      <div class="score-value ${scoreColor(fluency)}">${fluency}</div>
      <div class="score-label">Fluency</div>
    </div>
    <div class="score-item">
      <div class="score-value ${scoreColor(completeness)}">${completeness}</div>
      <div class="score-label">Completeness</div>
    </div>
    <div class="score-item">
      <div class="score-value ${scoreColor(prosody)}">${prosody}</div>
      <div class="score-label">Prosody</div>
    </div>
    <div class="score-item">
      <div class="score-value ${scoreColor(100 - werResult.wer)}">${werResult.wer}%</div>
      <div class="score-label">WER</div>
    </div>
  `;
  document.getElementById('scoresCard').classList.remove('hidden');

  // Word highlighting
  const refWords = currentText.split(/\s+/);
  let passageHtml = '';
  const assessedQueue = {};
  words.forEach(w => {
    const key = w.Word.toLowerCase().replace(/[^a-z']/g, '');
    if (!assessedQueue[key]) assessedQueue[key] = [];
    assessedQueue[key].push(w);
  });

  refWords.forEach(refWord => {
    const clean = refWord.toLowerCase().replace(/[^a-z']/g, '');
    let wordData = null;
    if (assessedQueue[clean] && assessedQueue[clean].length > 0) {
      wordData = assessedQueue[clean].shift();
    }
    if (wordData) {
      const score = Math.round(wordData.PronunciationAssessment?.AccuracyScore || 0);
      const errorType = wordData.PronunciationAssessment?.ErrorType || 'None';
      const cls = wordClass(score, errorType);
      const label = errorType !== 'None' ? `${score}/100 (${errorType})` : `${score}/100`;
      passageHtml += `<span class="word ${cls}">${refWord}<span class="tooltip">${label}</span></span> `;
    } else {
      passageHtml += `<span class="word word-missed">${refWord}<span class="tooltip">Not detected</span></span> `;
    }
  });
  document.getElementById('readingText').innerHTML = passageHtml;

  // Transcript comparison
  let refHtml = '', hypHtml = '';
  werResult.alignment.forEach(a => {
    if (a.type === 'correct') {
      refHtml += `<span class="diff-word diff-ok">${a.ref}</span> `;
      hypHtml += `<span class="diff-word diff-ok">${a.hyp}</span> `;
    } else if (a.type === 'substitution') {
      refHtml += `<span class="diff-word diff-sub">${a.ref}</span> `;
      hypHtml += `<span class="diff-word diff-sub">${a.hyp}</span> `;
    } else if (a.type === 'deletion') {
      refHtml += `<span class="diff-word diff-del">${a.ref}</span> `;
      hypHtml += `<span class="diff-word diff-del">___</span> `;
    } else if (a.type === 'insertion') {
      hypHtml += `<span class="diff-word diff-ins">[${a.hyp}]</span> `;
    }
  });
  document.getElementById('transcriptRef').innerHTML = refHtml;
  document.getElementById('transcriptHeard').innerHTML = hypHtml;
  document.getElementById('transcriptCard').classList.remove('hidden');

  // AI Tutor feedback
  const pronResultLike = {
    accuracyScore: scores.accuracyScore,
    fluencyScore: scores.fluencyScore,
    completenessScore: scores.completenessScore,
    prosodyScore: scores.prosodyScore,
    pronunciationScore: scores.pronunciationScore
  };
  const tutorMessages = generateTutorFeedback(pronResultLike, words, werResult);
  let tutorHtml = '';
  tutorMessages.forEach(msg => {
    tutorHtml += `<div class="tutor-message"><h3>${msg.title}</h3><p>${msg.body}</p>`;
    if (msg.tips && msg.tips.length > 0) {
      tutorHtml += '<ul>' + msg.tips.map(t => `<li>${t}</li>`).join('') + '</ul>';
    }
    tutorHtml += '</div>';
  });
  document.getElementById('tutorFeedback').innerHTML = tutorHtml;
  document.getElementById('tutorCard').classList.remove('hidden');

  // Practice words
  const problemWords = words.filter(w =>
    (w.PronunciationAssessment?.AccuracyScore || 0) < 60 ||
    (w.PronunciationAssessment?.ErrorType && w.PronunciationAssessment.ErrorType !== 'None')
  );
  if (problemWords.length > 0) {
    const unique = [...new Set(problemWords.map(w => w.Word))];
    document.getElementById('practiceWords').innerHTML = unique.slice(0, 8).map(w =>
      `<div class="practice-word">${w}</div>`
    ).join('');
    document.getElementById('practiceCard').classList.remove('hidden');
  }

  // History
  sessionHistory.push({
    time: new Date().toISOString(), level: currentLevel,
    overall, accuracy, fluency, completeness, prosody, wer: werResult.wer
  });
  if (sessionHistory.length > 20) sessionHistory = sessionHistory.slice(-20);
  localStorage.setItem('writerly_history', JSON.stringify(sessionHistory));
  renderHistory();

  setStatus('Assessment complete! Hover over words for details. Scroll down for feedback.');
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
  document.getElementById('status').className = 'status';
}

function scoreColor(score) {
  if (score >= 80) return 'score-green';
  if (score >= 60) return 'score-yellow';
  return 'score-red';
}

function wordClass(score, errorType) {
  if (errorType === 'Omission') return 'word-missed';
  if (score >= 90) return 'word-perfect';
  if (score >= 75) return 'word-good';
  if (score >= 50) return 'word-fair';
  return 'word-poor';
}

// ---- WER Calculation ----
function calcWER(reference, hypothesis) {
  const ref = reference.toLowerCase().replace(/[^a-z' ]/g, '').split(/\s+/).filter(Boolean);
  const hyp = hypothesis.toLowerCase().replace(/[^a-z' ]/g, '').split(/\s+/).filter(Boolean);
  const n = ref.length;
  const m = hyp.length;
  const d = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  const ops = Array.from({length: n + 1}, () => new Array(m + 1).fill(''));

  for (let i = 0; i <= n; i++) { d[i][0] = i; ops[i][0] = 'D'; }
  for (let j = 0; j <= m; j++) { d[0][j] = j; ops[0][j] = 'I'; }
  ops[0][0] = '';

  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      if (ref[i-1] === hyp[j-1]) {
        d[i][j] = d[i-1][j-1];
        ops[i][j] = 'C'; // correct
      } else {
        const sub = d[i-1][j-1] + 1;
        const del = d[i-1][j] + 1;
        const ins = d[i][j-1] + 1;
        const min = Math.min(sub, del, ins);
        d[i][j] = min;
        if (min === sub) ops[i][j] = 'S';
        else if (min === del) ops[i][j] = 'D';
        else ops[i][j] = 'I';
      }
    }
  }

  // Backtrace
  let i = n, j = m;
  const alignment = [];
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && ops[i][j] === 'C') {
      alignment.unshift({ type: 'correct', ref: ref[i-1], hyp: hyp[j-1] });
      i--; j--;
    } else if (i > 0 && j > 0 && ops[i][j] === 'S') {
      alignment.unshift({ type: 'substitution', ref: ref[i-1], hyp: hyp[j-1] });
      i--; j--;
    } else if (i > 0 && ops[i][j] === 'D') {
      alignment.unshift({ type: 'deletion', ref: ref[i-1], hyp: null });
      i--;
    } else {
      alignment.unshift({ type: 'insertion', ref: null, hyp: hyp[j-1] });
      j--;
    }
  }

  const subs = alignment.filter(a => a.type === 'substitution').length;
  const dels = alignment.filter(a => a.type === 'deletion').length;
  const ins = alignment.filter(a => a.type === 'insertion').length;
  const wer = n > 0 ? ((subs + dels + ins) / n * 100) : 0;

  return { wer: Math.round(wer * 10) / 10, subs, dels, ins, total: n, alignment };
}

// ---- AI Tutor Feedback ----
function generateTutorFeedback(pronResult, words, werResult) {
  const accuracy = pronResult.accuracyScore;
  const fluency = pronResult.fluencyScore;
  const completeness = pronResult.completenessScore;
  const prosody = pronResult.prosodyScore || 0;
  const overall = pronResult.pronunciationScore;

  const messages = [];

  // Overall assessment
  if (overall >= 90) {
    messages.push({
      title: 'Excellent Reading!',
      body: 'You read that beautifully! Your pronunciation is very clear and natural. Keep up the great work!',
      type: 'success'
    });
  } else if (overall >= 75) {
    messages.push({
      title: 'Good Job!',
      body: 'That was a solid reading. There are just a few areas we can work on together to make it even better.',
      type: 'good'
    });
  } else if (overall >= 55) {
    messages.push({
      title: 'Nice Try!',
      body: "You're making good progress. Let's focus on a few things that will help you improve quickly.",
      type: 'encourage'
    });
  } else {
    messages.push({
      title: "Let's Practice Together",
      body: "Reading takes practice, and every attempt makes you better. Let's work through this step by step.",
      type: 'encourage'
    });
  }

  // Fluency feedback
  if (fluency < 60) {
    messages.push({
      title: 'Pacing Tip',
      body: "Try to read at a steady, comfortable pace. It's okay to slow down on longer words. Think of reading like walking — not too fast, not too slow, just a nice even rhythm.",
      tips: ['Take a breath at each period or comma', 'Try reading the passage silently first, then aloud']
    });
  } else if (fluency < 80) {
    messages.push({
      title: 'Pacing',
      body: 'Your pacing is pretty good! Try to smooth out the flow between sentences. Reading aloud to a family member can help build natural rhythm.',
      tips: ['Practice connecting words within phrases instead of pausing between each word']
    });
  }

  // Completeness feedback
  if (completeness < 80) {
    const missed = words.filter(w => w.PronunciationAssessment?.ErrorType === 'Omission');
    if (missed.length > 0) {
      messages.push({
        title: 'Missed Words',
        body: `You skipped ${missed.length} word${missed.length > 1 ? 's' : ''}. That's okay — try following along with your finger as you read. It helps make sure you don't miss any words.`,
        tips: missed.slice(0, 3).map(w => `"${w.Word}" — try saying it: ${w.Word.split('').join(' - ')}`)
      });
    }
  }

  // Pronunciation patterns
  const mispronounced = words.filter(w =>
    w.PronunciationAssessment?.ErrorType === 'Mispronunciation' ||
    (w.PronunciationAssessment?.AccuracyScore || 0) < 50
  );

  if (mispronounced.length > 0) {
    // Check for long word struggles
    const longWordIssues = mispronounced.filter(w => w.Word.length > 6);
    const shortWordIssues = mispronounced.filter(w => w.Word.length <= 3);

    if (longWordIssues.length >= 2) {
      messages.push({
        title: 'Breaking Down Big Words',
        body: 'Some of the longer words were tricky. A great strategy is to break them into smaller parts (syllables) and say each part separately, then put them together.',
        tips: longWordIssues.slice(0, 3).map(w => {
          const word = w.Word;
          return `"${word}" — try: ${syllabify(word)}`;
        })
      });
    }

    if (shortWordIssues.length >= 2) {
      messages.push({
        title: 'Small Words Matter Too',
        body: "Even small words need attention. Sometimes we rush through them. Try to say each word clearly, even the short ones like 'the', 'a', 'in'.",
      });
    }
  }

  // Prosody feedback
  if (prosody > 0 && prosody < 60) {
    messages.push({
      title: 'Expression',
      body: "Try adding more expression when you read. When you see a question mark, make your voice go up. When you see an exclamation mark, say it with energy! When you see a period, pause briefly.",
      tips: [
        'Question marks (?) — voice goes UP at the end',
        'Exclamation marks (!) — say it with excitement',
        'Commas (,) — take a tiny pause'
      ]
    });
  }

  // WER feedback
  if (werResult.wer > 0) {
    let werMsg = '';
    if (werResult.subs > 0) werMsg += `${werResult.subs} word${werResult.subs > 1 ? 's were' : ' was'} different from what was expected. `;
    if (werResult.dels > 0) werMsg += `${werResult.dels} word${werResult.dels > 1 ? 's were' : ' was'} skipped. `;
    if (werResult.ins > 0) werMsg += `${werResult.ins} extra word${werResult.ins > 1 ? 's were' : ' was'} added. `;

    if (werResult.wer <= 10) {
      werMsg = 'Almost perfect match! ' + werMsg;
    } else if (werResult.wer <= 25) {
      werMsg = 'Good match with the text. ' + werMsg;
    }
  }

  return messages;
}

function syllabify(word) {
  // Simple syllable approximation
  const vowels = 'aeiouy';
  let syllables = [];
  let current = '';
  let prevVowel = false;

  for (let i = 0; i < word.length; i++) {
    const c = word[i].toLowerCase();
    const isVowel = vowels.includes(c);
    current += word[i];

    if (isVowel && !prevVowel && current.length > 1 && i < word.length - 1) {
      // Check if next char is consonant
      if (!vowels.includes(word[i+1]?.toLowerCase()) && i + 1 < word.length - 1) {
        syllables.push(current);
        current = '';
      }
    }
    prevVowel = isVowel;
  }
  if (current) syllables.push(current);
  if (syllables.length <= 1) return word;
  return syllables.join(' · ');
}

// displayResults removed — replaced by displayResultsFromContinuous above

function renderHistory() {
  if (sessionHistory.length === 0) return;
  document.getElementById('historyCard').classList.remove('hidden');

  const chart = document.getElementById('historyChart');
  chart.innerHTML = '';
  sessionHistory.forEach((h, i) => {
    const bar = document.createElement('div');
    bar.className = 'history-bar';
    const score = h.overall;
    const height = Math.max(8, score * 0.75);
    const color = score >= 80 ? 'var(--green)' : score >= 60 ? 'var(--yellow)' : 'var(--red)';
    bar.style.height = height + 'px';
    bar.style.background = color;
    const time = new Date(h.time);
    bar.setAttribute('data-label', `${score}% — ${time.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`);
    chart.appendChild(bar);
  });

  const latest = sessionHistory[sessionHistory.length - 1];
  const first = sessionHistory[0];
  const diff = latest.overall - first.overall;
  const trend = diff > 0 ? `+${diff} points since first attempt` : diff < 0 ? `${diff} points` : 'Same as first attempt';
  document.getElementById('historyMeta').textContent =
    `${sessionHistory.length} attempt${sessionHistory.length > 1 ? 's' : ''} this session | ${trend}`;
}
